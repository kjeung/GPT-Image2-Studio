# GPT-Image2-Studio — Docker Compose 部署
#
#   cp .env.example .env           # 填 API Key 与 Traefik 相关变量
#   ./start.sh                     # 渲染 traefik-dynamic.yml 并起容器
#
# 这份文件只部署 studio 本体，**不发布任何宿主端口**（只用 expose: 声明内部端口）。
#
# ⚠️ 访问控制由前置 Traefik + Authentik 负责。
# 本 fork 已移除应用自身的鉴权（见 lib/local-server-auth.mjs），所以：
#   - 这里没有 ports:，容器只挂在 Traefik 的 docker 网络里；
#   - 对外唯一入口必须是带 Authentik 认证的 Traefik 路由（见 traefik-dynamic.yml.example）；
#   - 不要为了「先跑起来看看」加 ports: —— 那等于把一个可消耗 API 额度的
#     studio 直接裸露在网络上，且没有任何东西挡着。本机调试请用
#     compose.local.yml（只绑 127.0.0.1）。
#
# 网络：Traefik、Authentik 与本服务必须处于同一 docker 网络。默认用外部网络
# `traefik_net`，可用 .env 里的 TRAEFIK_NET 覆盖名字；本仓库**不创建**它。
#   docker network create traefik_net  # 若尚不存在

name: gpt-image2-studio

services:
  studio:
    build:
      # 这是 kjeung 的 fork：没有上游官方镜像，也没有 CI 发布链路，
      # 所以按规则「只在确实需要时本地构建」的例外情形，这里用本地构建。
      context: .
      dockerfile: Dockerfile
    # 镜像 tag 用仓库版本号；STUDIO_TAG 可在 .env 里覆盖。
    image: gpt-image2-studio:${STUDIO_TAG:-0.3.001}
    container_name: gpt-image2-studio
    restart: unless-stopped
    # 回收僵尸进程并向 node 转发信号（server.mjs 自身不装信号处理器）。
    init: true
    env_file:
      - .env
    environment:
      PORT: "3600"
      # 容器内必须监听全部接口，否则网桥上的 Traefik 接不进来。
      HOST: "0.0.0.0"
      # 两个目录都在 /data 下：画廊索引写在 dirname(OUTPUT_DIR)/.local/，
      # 必须与数据目录同卷，否则索引与图片会分裂。
      IMAGE_STUDIO_OUTPUT_DIR: "/data/output"
      IMAGE_STUDIO_LOCAL_DATA_DIR: "/data"
      # Docker 自带可用解析器；应用内那条公共 DNS 兜底只会拖慢并引入额外失败路径。
      IMAGE_STUDIO_DISABLE_DNS_FALLBACK: "1"
      TZ: "${TZ:-Asia/Shanghai}"
    # 只声明内部端口，不发布到宿主。Traefik 通过 traefik_net 直连它。
    expose:
      - "3600"
    labels:
      # exposedByDefault=true 时 Traefik 会自动发现并暴露每个容器。这里显式关掉，
      # 让路由**只能**来自 file provider 的 traefik-dynamic.yml —— 那一份带
      # Authentik 认证。若不关，容器可能被自动暴露成一条无认证入口。
      traefik.enable: "false"
    # 数据落在宿主机当前目录下的 ./data/（绑定挂载，不用 docker volume）：
    # 备份直接复制目录，换 compose 工程名也不会丢。目录不存在时容器以 root
    # 建目录，但应用以 node 用户运行写不进去 —— 首次启动前 start.sh 会处理，
    # 或手动执行：mkdir -p data && chown 1000:1000 data
    volumes:
      - ${DATA_DIR:-./data}:/data
    networks:
      - traefik_net
    healthcheck:
      # 容器内探活走 127.0.0.1，与网络命名空间一致，不受 HOST 影响。
      test:
        - CMD
        - node
        - -e
        - 'fetch("http://127.0.0.1:3600/").then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))'
      interval: 30s
      timeout: 5s
      start_period: 25s
      retries: 3
    stop_grace_period: 15s
    # 长连接（SSE）需要 Traefik 侧关掉缓冲与读超时，见 traefik-dynamic.yml.example。
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  traefik_net:
    external: true
    # 名字可用 .env 的 TRAEFIK_NET 覆盖；本仓库不创建这个网络。
    name: ${TRAEFIK_NET:-traefik_net}
